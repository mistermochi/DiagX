<!DOCTYPE html>
<html>
<body>
<script>
const xml = `<mxfile host="app.diagrams.net">
  <diagram>
    <mxGraphModel>
      <root>
        <mxCell id="0" />
        <mxCell id="1" parent="0" />
        <mxCell id="node_1" vertex="1" parent="1">
          <mxGeometry x="60" y="20" width="730" height="50" as="geometry" />
        </mxCell>
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;

const doc = new DOMParser().parseFromString(xml, 'text/xml');
const cells = doc.querySelectorAll('mxCell');
console.log('Cells count:', cells.length);
document.body.innerHTML = 'Cells count: ' + cells.length;
</script>
</body>
</html>
